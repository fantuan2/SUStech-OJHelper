<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OJHelper</title>
  <link rel="stylesheet" href="../lib/settings-ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <header class="head">
      <img src="../../icons/icon48.png" alt="OJHelper" class="logo">
      <div>
        <h1>OJHelper</h1>
        <p class="sub" data-i18n="optionsSub"></p>
      </div>
    </header>

    <div id="ojh-root"></div>

    <section class="ojh-sites" id="ojh-sites">
      <div class="ojh-sites-head">
        <h2 data-i18n="enabledSites"></h2>
        <p class="ojh-sites-note" data-i18n="siteBetaNote"></p>
      </div>
      <ul class="ojh-sites-list" id="ojh-sites-list"></ul>
    </section>
  </div>

  <script src="../lib/core.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/langs/java.js"></script>
  <script src="../lib/langs/cc.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="../lib/settings-ui.js"></script>
  <script src="../lib/registry.js"></script>
  <script src="options.js"></script>
</body>
</html>
